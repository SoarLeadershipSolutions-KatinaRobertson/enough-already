name: Diagnose Mailchimp integration

on:
  push:
    paths:
      - '.github/workflows/diagnose-mailchimp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check live page and Mailchimp endpoints
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://soarleadershipsolutions-katinarobertson.github.io/enough-already/'
          MC='https://chimpstatic.com/mcjs-connected/js/users/34174a1bd11cad56c974a1920/847bde1919ae7937546a3d4d7.js'
          FORM_ASSET='https://form-assets.mailchimp.com/snippet/account/192635718?site=847bde1919ae7937546a3d4d7'

          echo '=== LIVE PAGE HEADERS ==='
          curl -sSIL "$SITE" | sed -n '1,80p'

          echo '=== CONNECTED-SITE SCRIPT: HEAD ==='
          curl -sSIL "$MC" | sed -n '1,100p' || true

          echo '=== CONNECTED-SITE SCRIPT: GET ==='
          curl -sSL -D /tmp/mc.headers "$MC" -o /tmp/mc.js
          wc -c /tmp/mc.js
          sed -n '1,80p' /tmp/mc.headers
          grep -Eoi '.{0,100}(amped_forms|uid|site_unique_id|form-assets).{0,180}' /tmp/mc.js | head -40 || true

          echo '=== FORM-ASSET SCRIPT: HEAD ==='
          curl -sSIL "$FORM_ASSET" | sed -n '1,100p' || true

          echo '=== FORM-ASSET SCRIPT: GET ==='
          curl -sSL -D /tmp/form.headers "$FORM_ASSET" -o /tmp/form.js
          wc -c /tmp/form.js
          sed -n '1,100p' /tmp/form.headers

          echo '=== FORM-ASSET SCRIPT FIRST 12000 CHARS ==='
          head -c 12000 /tmp/form.js
          echo

          echo '=== FORM-ASSET URLS / KEYWORDS ==='
          grep -Eo 'https?://[^"[:space:]]+' /tmp/form.js | sort -u | head -100 || true
          grep -Eoi '.{0,150}(list-manage|subscribe|popup|form|audience|campaign|published|draft|site|trigger|modal).{0,220}' /tmp/form.js | head -160 || true

      - name: Test the deployed page in Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm --silent install puppeteer-core@24
          cat > /tmp/test-mailchimp.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });
          const page = await browser.newPage();
          await page.setViewport({ width: 1365, height: 900 });

          page.on('console', (msg) => console.log('BROWSER CONSOLE', msg.type(), msg.text()));
          page.on('pageerror', (err) => console.log('PAGE ERROR', err.message));
          page.on('requestfailed', (req) => console.log('REQUEST FAILED', req.url(), req.failure()?.errorText));
          page.on('response', (res) => {
            const url = res.url();
            if (/mailchimp|chimpstatic|form-assets|list-manage/i.test(url)) {
              console.log('MAILCHIMP RESPONSE', res.status(), url);
            }
          });

          const url = 'https://soarleadershipsolutions-katinarobertson.github.io/enough-already/?diagnostic=1';
          console.log('NAVIGATING', url);
          await page.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });
          await new Promise((resolve) => setTimeout(resolve, 6000));

          const before = await page.evaluate(() => ({
            title: document.title,
            mcSite: Boolean(window.$mcSite),
            ampedForms: Boolean(window.$mcSite?.amped_forms),
            registerButtons: document.querySelectorAll('.js-register').length,
            scripts: [...document.scripts].map((s) => s.src).filter((src) => /mailchimp|chimpstatic|form-assets/i.test(src)),
            bodyText: document.body.innerText.slice(0, 1000)
          }));
          console.log('BEFORE CLICK', JSON.stringify(before, null, 2));

          await page.click('.js-register');
          await new Promise((resolve) => setTimeout(resolve, 10000));

          const after = await page.evaluate(() => {
            const selectors = [
              '[id^="PopupSignupForm_"]', '[id*="PopupSignupForm"]', '.mc-modal',
              '.mc-layout__modalContent', '[data-dojo-attach-point="modalContent"]',
              'iframe[src*="mailchimp"]', 'iframe[src*="list-manage"]',
              'iframe[title*="Mailchimp" i]', '[data-testid*="popup" i]',
              '[class*="popup" i]', '[class*="modal" i]'
            ];
            const matches = selectors.flatMap((selector) => [...document.querySelectorAll(selector)].map((el) => ({
              selector,
              tag: el.tagName,
              id: el.id,
              className: typeof el.className === 'string' ? el.className : '',
              hidden: el.hidden,
              display: getComputedStyle(el).display,
              visibility: getComputedStyle(el).visibility,
              text: (el.innerText || '').slice(0, 300)
            })));
            return {
              mcSite: Boolean(window.$mcSite),
              ampedForms: Boolean(window.$mcSite?.amped_forms),
              ampedInstalled: window.$mcSite?.amped_forms?.installed,
              cookies: document.cookie,
              status: document.getElementById('registration-status')?.innerText,
              matches,
              scripts: [...document.scripts].map((s) => s.src).filter((src) => /mailchimp|chimpstatic|form-assets/i.test(src))
            };
          });
          console.log('AFTER CLICK', JSON.stringify(after, null, 2));
          await page.screenshot({ path: '/tmp/mailchimp-page.png', fullPage: true });
          await browser.close();
          NODE
          node /tmp/test-mailchimp.mjs
