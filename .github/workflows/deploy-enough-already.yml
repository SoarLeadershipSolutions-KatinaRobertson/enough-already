name: Deploy Enough Already landing page

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-enough-already.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install final landing page
        shell: bash
        run: |
          cat > /tmp/enough-already-site.b64 <<'SITE_ARCHIVE'
          
          
          
          
          
          SITE_ARCHIVE

          base64 --decode /tmp/enough-already-site.b64 > /tmp/enough-already-site.tar.gz
          tar -xzf /tmp/enough-already-site.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/deploy-enough-already.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes detected."
            exit 0
          fi
          git commit -m "Deploy final Enough Already landing page"
          git push origin HEAD:main
