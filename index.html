<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enough Already! You're Ready Now. | September 16–17, 2026</title>
  <meta name="description" content="A two-day live virtual experience for high-achieving women, led by Katina Christmas Robertson, September 16–17, 2026, 10:00 AM–1:00 PM ET.">
  <meta name="theme-color" content="#0b3d68">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { background: #F7FBFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F7FBFC;
      color: #0B3D68;
    }
    .loader svg { width: 100%; height: 100%; object-fit: contain; }
    .loader__status {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 2;
      margin: 0;
      padding: 8px 14px;
      color: #666;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
      font-size: 13px;
      line-height: 1.4;
    }
    .loader__error {
      display: none;
      position: fixed;
      right: 20px;
      bottom: 66px;
      left: 20px;
      z-index: 3;
      max-width: 680px;
      margin: auto;
      padding: 12px 16px;
      color: #fff;
      background: #0B3D68;
      border-radius: 4px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="loader" aria-live="polite" aria-label="Loading the Enough Already experience">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SOAR Leadership Solutions">
      <rect width="1200" height="800" fill="#F7FBFC"></rect>
      <rect x="420" y="250" width="90" height="8" rx="4" fill="#05A6C7"></rect>
      <rect x="510" y="250" width="90" height="8" rx="4" fill="#49B98F"></rect>
      <rect x="600" y="250" width="90" height="8" rx="4" fill="#FF9738"></rect>
      <rect x="690" y="250" width="90" height="8" rx="4" fill="#E62F50"></rect>
      <text x="600" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="150" fill="#0B3D68">SOAR</text>
      <rect x="480" y="500" width="240" height="52" rx="4" fill="#FF9738"></rect>
    </svg>
    <p class="loader__status">Loading…</p>
    <p class="loader__error" id="load-error">The page could not be loaded. Please refresh and try again.</p>
  </main>

  <noscript>This page requires JavaScript to display.</noscript>

  <script>
    (() => {
      'use strict';

      const pinnedRevision = '0baa2166fdb4a67e2e3fa38c51a259d7709b173e';
      const repository = 'SoarLeadershipSolutions-KatinaRobertson/enough-already';
      const productionSources = [
        `https://cdn.jsdelivr.net/gh/${repository}@${pinnedRevision}/index.html`,
        `https://raw.githubusercontent.com/${repository}/${pinnedRevision}/index.html`
      ];

      const localOverride = ['localhost', '127.0.0.1'].includes(location.hostname)
        ? new URLSearchParams(location.search).get('source')
        : null;
      const sources = localOverride ? [localOverride] : productionSources;

      async function fetchOriginal() {
        let lastError;
        for (const source of sources) {
          try {
            const response = await fetch(source, { mode: 'cors', cache: 'force-cache' });
            if (!response.ok) throw new Error(`Source returned ${response.status}`);
            const html = await response.text();
            if (!html.includes('__bundler/manifest') || !html.includes('__bundler/template')) {
              throw new Error('Pinned source is not the approved bundled page');
            }
            return html;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error('No source was available');
      }

      async function boot() {
        const original = await fetchOriginal();
        const patchTag = '<link rel="stylesheet" href="./soar-brand.css?v=2026-08-26-restored-r1" data-soar-brand-styles><script src="./content-patch-loader.js?v=2026-08-26-restored-r1" data-soar-content-patch><\/script>';
        const patchedSource = /<\/head>/i.test(original)
          ? original.replace(/<\/head>/i, `${patchTag}</head>`)
          : original.replace(/<body/i, `${patchTag}<body`);

        document.open();
        document.write(patchedSource);
        document.close();
      }

      boot().catch((error) => {
        console.error('[SOAR] Unable to load the approved source page.', error);
        const message = document.getElementById('load-error');
        if (message) message.style.display = 'block';
      });
    })();
  </script>
</body>
</html>
